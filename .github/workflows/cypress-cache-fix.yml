name: Cypress Cache Fix

on: [pull_request]

jobs:
  cypress-cache-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Configure pnpm side-effects-cache
        run: pnpm config set side-effects-cache false --location project

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      # Explicitly cache Cypress binary directory
      - name: Cache Cypress binary directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Cypress
            node_modules/cypress
            /home/runner/.cache/Cypress
          key: ${{ runner.os }}-cypress-binary-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cypress-binary-

      # Force Cypress installation if cache miss
      - name: Install Cypress binary
        run: |
          echo "Installing Cypress binary..."
          npx cypress install
          echo "Cypress binary installed successfully"

      - name: Verify Cypress installation
        run: |
          echo "Cypress version:"
          npx cypress --version
          echo "Cypress cache path:"
          npx cypress cache path
          echo "Verifying Cypress binary:"
          npx cypress verify

      - name: Run Cypress Component Tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          component: true
          wait-on: "http://localhost:4173"
          wait-on-timeout: 120
          record: false
          parallel: false
          group: "Component Tests"
          spec: "cypress/component/**/*.cy.{js,jsx,ts,tsx}"

      - name: Start preview server
        run: |
          pnpm run preview &
          echo "Waiting for server to start..."
          sleep 20
          echo "Checking if server is running..."
          for i in {1..5}; do
            if curl -f http://localhost:4173 > /dev/null 2>&1; then
              echo "Server is running on port 4173"
              break
            else
              echo "Attempt $i: Server not ready yet, waiting..."
              sleep 5
            fi
          done

      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          wait-on: "http://localhost:4173"
          wait-on-timeout: 120
          record: false
          parallel: false
          group: "E2E Tests"
          spec: "cypress/e2e/**/*.cy.{js,jsx,ts,tsx}"
          config: baseUrl=http://localhost:4173

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          if-no-files-found: ignore

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos/
          if-no-files-found: ignore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          if-no-files-found: error
