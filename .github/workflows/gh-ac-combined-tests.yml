name: Combined Tests with PR Comments

on: [pull_request]

jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress install
        uses: cypress-io/github-action@v6
        with:
          runTests: false
          build: npm run build

      - name: Save build folder
        uses: actions/upload-artifact@v4
        with:
          name: dist
          if-no-files-found: error
          path: dist

  cypress-run:
    runs-on: ubuntu-24.04
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the build folder
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          start: npm run preview
          wait-on: "http://localhost:4173"
          browser: chrome
          record: false
          config: video=false,screenshotOnRunFailure=true

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore

  react-testing-library:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run React Testing Library tests with coverage
        run: npm test -- --coverage --coverageReporters=json-summary --coverageReporters=text --coverageReporters=lcov --coverageReporters=html --coverageReporters=json

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          if-no-files-found: ignore

  comment-results:
    runs-on: ubuntu-24.04
    needs: [cypress-run, react-testing-library]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: coverage/

      - name: Generate test summary
        id: test-summary
        run: |
          if [ -f "coverage/coverage-summary.json" ]; then
            COVERAGE=$(cat coverage/coverage-summary.json | jq -r '.total.lines.pct // "N/A"')
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          else
            echo "coverage=N/A" >> $GITHUB_OUTPUT
          fi

          if [ "${{ needs.cypress-run.result }}" == "success" ] && [ "${{ needs.react-testing-library.result }}" == "success" ]; then
            echo "status=✅ All tests passed" >> $GITHUB_OUTPUT
          else
            echo "status=❌ Some tests failed" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR with test results
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## 🧪 Test Results Summary')
            );

            const coverage = '${{ steps.test-summary.outputs.coverage }}';
            const status = '${{ steps.test-summary.outputs.status }}';

            const commentBody = `## 🧪 Test Results Summary

${status}

### 📊 Test Coverage
- **Lines**: ${coverage}%

### 🔍 Test Types
- **React Testing Library (Jest)**: ${{ needs.react-testing-library.result == 'success' ? '✅ Passed' : '❌ Failed' }}
- **Cypress E2E**: ${{ needs.cypress-run.result == 'success' ? '✅ Passed' : '❌ Failed' }}

### 📁 Artifacts
- **Coverage Reports**: Available in workflow artifacts
- **Cypress Screenshots**: Available if tests failed
- **Cypress Videos**: Available in workflow artifacts

---
*This comment was automatically generated by GitHub Actions*`;

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
