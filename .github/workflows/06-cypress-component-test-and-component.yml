name: Cypress Component Tests

permissions:
  pull-requests: write
  contents: read

on: [pull_request]

jobs:
  component-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Create Cypress results directory
        run: mkdir -p cypress/results

      - name: Run Cypress Component Tests
        run: |
          npx cypress run --component --browser chrome \
          --reporter junit --reporter-options "mochaFile=cypress/results/results.xml,toConsole=true"

      - name: Install xmlstarlet
        run: sudo apt-get install -y xmlstarlet

      - name: Parse Cypress test results
        id: cypress-results
        run: |
          if [ -f "cypress/results/results.xml" ]; then
            PASSED=$(xmlstarlet sel -t -v "testsuites/@tests" cypress/results/results.xml)
            FAILED=$(xmlstarlet sel -t -v "testsuites/@failures" cypress/results/results.xml)
          else
            PASSED="0"
            FAILED="0"
          fi
          echo "PASSED=$PASSED" >> $GITHUB_OUTPUT
          echo "FAILED=$FAILED" >> $GITHUB_OUTPUT

      - name: Upload Cypress Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results
          path: cypress/results/results.xml

      - name: Comment on PR with Cypress results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const passed = '${{ steps.cypress-results.outputs.PASSED }}';
            const failed = '${{ steps.cypress-results.outputs.FAILED }}';
            const status = failed === '0' ? '✅ All tests passed!' : `❌ ${failed} test(s) failed`;

            const body = `### 🌐 Cypress: Component - Test Results

            | Metric  | Result |
            |---------|--------|
            | ✅ Passed | ${passed} |
            | ❌ Failed | ${failed} |
            | 📊 Status | ${status} |

            <sub>_This comment was automatically generated by GitHub Actions._</sub>
            `;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.body.includes('### 🌐 Cypress: Component - Test Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }
