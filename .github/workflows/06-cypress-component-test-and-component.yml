name: Cypress Component Tests

on: [pull_request]

jobs:
  component-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Create Cypress results directory
        run: mkdir -p cypress/results

      - name: Run Cypress Component Tests
        uses: cypress-io/github-action@v6
        with:
          start: npm run cy:run:component
          browser: chrome
          config: video=false
          install: false
          # Output results to JUnit XML in the created directory
          command: npx cypress run --reporter junit --reporter-options "mochaFile=cypress/results/results.xml"
        continue-on-error: true

      - name: Parse Cypress test results
        id: cypress-results
        run: |
          # Check if results file exists
          if [ -f "cypress/results/results.xml" ]; then
            PASSED=$(grep -o 'tests="[0-9]*"' "cypress/results/results.xml" | head -1 | grep -o '[0-9]*' || echo "0")
            FAILED=$(grep -o 'failures="[0-9]*"' "cypress/results/results.xml" | head -1 | grep -o '[0-9]*' || echo "0")
          else
            echo "No Cypress results file found"
            PASSED="0"
            FAILED="0"
          fi
          echo "PASSED=$PASSED" >> $GITHUB_OUTPUT
          echo "FAILED=$FAILED" >> $GITHUB_OUTPUT

      - name: Comment on PR with Cypress results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const passed = '${{ steps.cypress-results.outputs.PASSED }}';
            const failed = '${{ steps.cypress-results.outputs.FAILED }}';
            const status = failed === '0' ? '✅ All tests passed!' : `❌ ${failed} test(s) failed`;

            const body = `### 🌐 Cypress: E2E - Test Results

            | Metric  | Result |
            |---------|--------|
            | ✅ Passed | ${passed} |
            | ❌ Failed | ${failed} |
            | 📊 Status | ${status} |

            <sub>_This comment was automatically generated by GitHub Actions._</sub>
            `;

            const { data: comments } = await github.rest.issues.listComments({
                ...context.repo,
                issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => comment.body.includes('### 🌐 Cypress Test Results'));

            if (botComment) {
                await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: botComment.id,
                body
                });
            } else {
                await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
                });
            }
