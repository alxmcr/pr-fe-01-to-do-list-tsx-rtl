name: Cypress Component Tests

on: [pull_request]

jobs:
  component-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress Component Tests
        uses: cypress-io/github-action@v6
        with:
          command: npm run cy:run:component
          browser: chrome
