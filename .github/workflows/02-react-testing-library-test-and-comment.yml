name: React Testing Library - Run Tests and Comment on PR

permissions:
  pull-requests: write
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Jest and capture output
        run: |
          npx jest --coverage > jest-output.txt 2>&1
          cat jest-output.txt # optional: see full output in job logs

      - name: Create comment body
        id: create-comment
        run: |
          echo 'COMMENT<<EOF' >> $GITHUB_ENV
          echo '### 🧪 Jest Test Results with Coverage Report' >> $GITHUB_ENV
          echo '```' >> $GITHUB_ENV
          cat jest-output.txt >> $GITHUB_ENV
          echo '```' >> $GITHUB_ENV
          echo '<sub>_This comment was automatically generated by GitHub Actions._</sub>' >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV

      - name: Comment on Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = process.env.COMMENT;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => comment.body.includes('### 🧪 Jest Test Results with Coverage Report'));

            if (botComment) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
