name: React Testing Library - Run Tests -- Test and Comment on PR

permissions:
  pull-requests: write
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests and generate report
        run: |
          mkdir -p ./test-results
          npx jest --ci --reporters=default --reporters=jest-junit --json --outputFile=./test-results/jest-results.json
        env:
          JEST_JUNIT_OUTPUT_DIR: ./test-results
          JEST_JUNIT_OUTPUT_NAME: jest-junit.xml

      - name: Read test summary (pass/fail count)
        id: get-results
        run: |
          PASSED=$(sed -n 's/.*tests="\([0-9]*\)".*/\1/p' ./test-results/jest-junit.xml | head -1)
          FAILED=$(sed -n 's/.*failures="\([0-9]*\)".*/\1/p' ./test-results/jest-junit.xml | head -1)
          echo "PASSED=$PASSED" >> $GITHUB_OUTPUT
          echo "FAILED=$FAILED" >> $GITHUB_OUTPUT

      - name: Format individual test results
        id: format-tests
        run: |
          node <<EOF > test-details.txt
          const fs = require('fs');

          const MAX_TESTS = 20; // Show only first 20 tests
          const raw = fs.readFileSync('./test-results/jest-results.json', 'utf8');
          const data = JSON.parse(raw);

          const tests = data.testResults.flatMap(suite =>
            suite.assertionResults.map(test => ({
              fullName: test.fullName,
              status: test.status
            }))
          );

          const lines = tests.slice(0, MAX_TESTS).map(test => {
            const icon = test.status === 'passed' ? '✅' : (test.status === 'failed' ? '❌' : '⚠️');
            return `- ${icon} ${test.fullName}`;
          });

          if (tests.length > MAX_TESTS) {
            lines.push(`\n...and ${tests.length - MAX_TESTS} more tests.`);
          }

          fs.writeFileSync('test-details.txt', lines.join('\\n'));
          EOF

          echo "DETAILS<<EOF" >> $GITHUB_OUTPUT
          cat test-details.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Add comment to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const passed = '${{ steps.get-results.outputs.PASSED }}';
            const failed = '${{ steps.get-results.outputs.FAILED }}';
            const details = `${{ steps.format-tests.outputs.DETAILS }}`;
            const status = failed === '0' ? '✅ All tests passed!' : `❌ ${failed} tests failed`;

            const body = `### 🧪 React Testing Library - Jest - Test Results

            | Metric  | Result |
            |---------|--------|
            | ✅ Passed | ${passed} |
            | ❌ Failed | ${failed} |
            | 📊 Status | ${status} |

            <details>
            <summary>Individual Test Results</summary>

            ${details}

            </details>

            <sub>_This comment was automatically generated by GitHub Actions._</sub>
            `;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.body.includes('### 🧪 React Testing Library - Jest - Test Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }
