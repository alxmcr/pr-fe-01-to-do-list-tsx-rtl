name: Cypress Tests with Dependency and Artifact Caching

permissions:
  pull-requests: write
  contents: read

on: [pull_request]

jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress install
        uses: cypress-io/github-action@v6
        with:
          # Disable running of tests within install job
          runTests: false
          build: npm run build

      - name: Save build folder
        uses: actions/upload-artifact@v4
        with:
          name: dist
          if-no-files-found: error
          path: dist

  cypress-run:
    runs-on: ubuntu-24.04
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the build folder
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          start: npm run preview
          wait-on: "http://localhost:4173"
          browser: chrome
          config: video=false
          install: false
          # Output results to JUnit XML
          command: npx cypress run --reporter junit --reporter-options "mochaFile=cypress/results/results-[hash].xml"
        continue-on-error: true

      - name: Parse Cypress test results
        id: cypress-results
        run: |
          FILE=$(find cypress/results -name "*.xml" | head -n 1)
          PASSED=$(grep -o 'tests="[0-9]*"' "$FILE" | head -1 | grep -o '[0-9]*')
          FAILED=$(grep -o 'failures="[0-9]*"' "$FILE" | head -1 | grep -o '[0-9]*')
          echo "PASSED=$PASSED" >> $GITHUB_OUTPUT
          echo "FAILED=$FAILED" >> $GITHUB_OUTPUT

      - name: Comment on PR with Cypress results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const passed = '${{ steps.cypress-results.outputs.PASSED }}';
            const failed = '${{ steps.cypress-results.outputs.FAILED }}';
            const status = failed === '0' ? '✅ All tests passed!' : `❌ ${failed} test(s) failed`;

            const body = `### 🌐 Cypress Test Results

                | Metric  | Result |
                |---------|--------|
                | ✅ Passed | ${passed} |
                | ❌ Failed | ${failed} |
                | 📊 Status | ${status} |

                <sub>_This comment was automatically generated by GitHub Actions._</sub>
                `;

            const { data: comments } = await github.rest.issues.listComments({
                ...context.repo,
                issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => comment.body.includes('### 🌐 Cypress Test Results'));

            if (botComment) {
                await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: botComment.id,
                body
                });
            } else {
                await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
                });
            }
