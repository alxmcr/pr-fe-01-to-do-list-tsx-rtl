name: Cypress Tests

on: [pull_request]

jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Configure pnpm side-effects-cache
        run: pnpm config set side-effects-cache false --location project

      - name: Install dependencies
        run: pnpm install

      - name: Install Cypress with build approval
        run: pnpm --allow-build=cypress add --save-dev cypress

      - name: Approve pnpm builds
        run: pnpm approve-builds

      - name: Cypress install
        uses: cypress-io/github-action@v6
        with:
          # Disable running of tests within install job
          runTests: false
          build: pnpm run build

      # 👇 Optional but helpful for debugging install issues
      - name: Verify Cypress binary
        run: npx cypress verify

      - name: Save build folder
        uses: actions/upload-artifact@v4
        with:
          name: build
          if-no-files-found: error
          path: dist
