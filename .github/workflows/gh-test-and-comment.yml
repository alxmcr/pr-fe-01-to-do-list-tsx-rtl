name: Test and Comment on PR

permissions:
  pull-requests: write
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests and generate report
        run: |
          npx jest --ci --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: ./test-results
          JEST_JUNIT_OUTPUT_NAME: jest-junit.xml

      - name: Read test results
        id: get-results
        run: |
          PASSED=$(sed -n 's/.*tests="\([0-9]*\)".*/\1/p' ./test-results/jest-junit.xml | head -1)
          FAILED=$(sed -n 's/.*failures="\([0-9]*\)".*/\1/p' ./test-results/jest-junit.xml | head -1)
          echo "PASSED=$PASSED" >> $GITHUB_OUTPUT
          echo "FAILED=$FAILED" >> $GITHUB_OUTPUT

      - name: Add comment to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const passed = '${{ steps.get-results.outputs.PASSED }}';
            const failed = '${{ steps.get-results.outputs.FAILED }}';
            const status = failed === '0' ? '✅ All tests passed!' : `❌ ${failed} tests failed`;

            const body = `### 🧪 Jest Test Results

                    **Passed:** ${passed}
                    **Failed:** ${failed}
                    **Status:** ${status}

                    _This comment was automatically generated by GitHub Actions._
            `;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => comment.body.includes('### 🧪 Jest Test Results'));

            if (botComment) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }
